<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoiseAtlas 噪声图谱 · 厂区噪声普查与预测</title>
  <link rel="stylesheet" href="/src/styles.css" />
  <link rel="stylesheet" href="/src/mobile.css" />
</head>
<body>
<div id="app">
  <!-- ── 移动端顶部栏（仅窄屏显示）── -->
  <header id="m-header">
    <button id="m-btn-projects" class="m-icon" title="项目列表">☰</button>
    <div class="m-title">
      <b id="m-project-name">NoiseAtlas</b>
      <small id="m-subtitle">未打开项目</small>
    </div>
    <button id="m-btn-actions" class="m-icon" title="工具">⋯</button>
  </header>

  <!-- ── 菜单栏 ── -->
  <nav id="menubar">
    <div class="brand" title="NoiseAtlas 噪声图谱 · 厂区噪声普查与预测">
      <img class="logo" src="/icon-32.png" alt="" />
      <span class="brand-text">
        <b>NoiseAtlas</b>
        <small>噪声图谱</small>
      </span>
    </div>
    <button class="menu" data-menu="file" title="新建 / 导入导出 / 导出图像与 PDF">文件</button>
    <button class="menu" data-menu="edit" title="删除项目 / 清空测点 / 清除源标记">编辑</button>
    <button class="menu" data-menu="view" title="视图切换 / 缩放 / 工具栏显示 / 图层显示">视图</button>
    <button class="menu" data-menu="calc" title="噪声源识别 / 声场重算 / 底图与定标">计算</button>
    <button class="menu" data-menu="help" title="关于本软件">帮助</button>
    <span class="spacer"></span>
    <span id="menubar-hint" class="hint-inline">厂区噪声网格普查 · 等声压级成图 · 噪声源定位</span>
  </nav>

  <div class="menu-panel" id="menu-file" hidden>
    <button data-cmd="new-project">新建项目…<kbd></kbd></button>
    <button data-cmd="demo">载入示例项目</button>
    <div class="menu-sep"></div>
    <button data-cmd="import">导入数据 (JSON)…</button>
    <button data-cmd="import-points">导入测点表 (JSON/CSV)…</button>
    <button data-cmd="export">导出数据 (JSON)…</button>
    <div class="menu-sep"></div>
    <button data-cmd="export-img">导出图像 (PNG)…</button>
    <button data-cmd="export-pdf">导出 PDF…</button>
    <button data-cmd="copy-img">复制图像到剪贴板</button>
  </div>

  <div class="menu-panel" id="menu-edit" hidden>
    <button data-cmd="delete-project">删除当前项目</button>
    <button data-cmd="clear-measurements">清空当前项目测点</button>
    <div class="menu-sep"></div>
    <button data-cmd="clear-noise-flags">清除噪声源标记</button>
  </div>

  <div class="menu-panel" id="menu-view" hidden>
    <button data-cmd="tab-entry">数据录入</button>
    <button data-cmd="tab-contour">等声压级图</button>
    <button data-cmd="tab-settings">图纸设置</button>
    <div class="menu-sep"></div>
    <button data-cmd="zoom-fit">缩放到全图</button>
    <div class="menu-sep"></div>
    <button data-cmd="tb-icon">工具栏：仅图标</button>
    <button data-cmd="tb-text">工具栏：仅文字</button>
    <button data-cmd="tb-both">工具栏：图标 + 文字</button>
    <div class="menu-sep"></div>
    <button data-cmd="toggle-calib">显示 / 隐藏定标线段</button>
    <button data-cmd="toggle-points">显示 / 隐藏测点</button>
    <button data-cmd="toggle-dims">显示 / 隐藏参考网格</button>
    <button data-cmd="toggle-scalebar">显示 / 隐藏比例尺</button>
  </div>

  <div class="menu-panel" id="menu-calc" hidden>
    <button data-cmd="noise">识别噪声源…</button>
    <button data-cmd="recompute">重新计算声场</button>
    <div class="menu-sep"></div>
    <button data-cmd="scope-paper">成图范围：整幅图纸</button>
    <button data-cmd="scope-points">成图范围：仅测点区域</button>
    <div class="menu-sep"></div>
    <button data-cmd="basemap">导入底图…</button>
    <button data-cmd="calibrate">两点定标</button>
  </div>

  <div class="menu-panel" id="menu-help" hidden>
    <button data-cmd="about">关于 NoiseAtlas</button>
  </div>

  <!-- ── 工具条 ── -->
  <header id="toolbar" class="mode-both">
    <div class="tb-group" data-cap="项目">
      <button id="btn-new-project" class="tb" title="新建项目：名称、图纸宽高、底噪">
        <svg class="ic" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
        <span class="tb-label">新建项目</span>
      </button>
      <button id="btn-demo" class="tb" title="载入示例项目：不规则布点的演示数据（3 处模拟声源）">
        <svg class="ic" viewBox="0 0 16 16"><path d="M8 2l1.6 4.4L14 8l-4.4 1.6L8 14l-1.6-4.4L2 8l4.4-1.6z"/></svg>
        <span class="tb-label">示例项目</span>
      </button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group" data-cap="数据">
      <button id="btn-import" class="tb" title="导入数据：读取旧版 AC-Camera / NoiseAtlas 导出的 JSON">
        <svg class="ic" viewBox="0 0 16 16"><path d="M8 2v8M5 7l3 3 3-3M3 13h10"/></svg>
        <span class="tb-label">导入</span>
      </button>
      <button id="btn-export" class="tb" title="导出数据：把全部项目与测点写成 JSON 文件">
        <svg class="ic" viewBox="0 0 16 16"><path d="M8 11V3M5 6l3-3 3 3M3 13h10"/></svg>
        <span class="tb-label">导出</span>
      </button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group viewtabs" data-cap="视图">
      <button data-tab="entry" class="tb viewtab active" title="测点录入：在底图任意位置点选，录入该点声级计实测值">
        <svg class="ic" viewBox="0 0 16 16"><path d="M3 3h10v10H3zM3 8h10M8 3v10"/></svg>
        <span class="tb-label">数据录入</span>
      </button>
      <button data-tab="contour" class="tb viewtab" title="等声压级图：声场彩图 + 等值曲线 + 噪声源标记">
        <svg class="ic" viewBox="0 0 16 16"><path d="M2 11c2-4 5-6 8-6s4 1 4 1M2 13c3-3 7-4 12-3"/></svg>
        <span class="tb-label">等声压级图</span>
      </button>
      <button data-tab="settings" class="tb viewtab" title="图纸设置：项目名称、行列数、间距、底噪、参照宽度">
        <svg class="ic" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.8 3.8l1.4 1.4M10.8 10.8l1.4 1.4M12.2 3.8l-1.4 1.4M5.2 10.8l-1.4 1.4"/></svg>
        <span class="tb-label">图纸设置</span>
      </button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group zoombar" data-cap="缩放">
      <button data-zoom="out" class="tb" title="缩小（也可用鼠标滚轮）">
        <svg class="ic" viewBox="0 0 16 16"><path d="M3 8h10"/></svg>
        <span class="tb-label">缩小</span>
      </button>
      <button data-zoom="in" class="tb" title="放大（也可用鼠标滚轮）">
        <svg class="ic" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
        <span class="tb-label">放大</span>
      </button>
      <button data-zoom="fit" class="tb" title="缩放到全图：恢复 100% 并居中">
        <svg class="ic" viewBox="0 0 16 16"><path d="M2 6V2h4M14 10v4h-4M2 10v4h4M14 6V2h-4"/></svg>
        <span class="tb-label">适应窗口</span>
      </button>
      <span id="zoom-readout" class="readout" title="当前缩放倍率">1.0×</span>
    </div>
    <span class="spacer"></span>
    <div class="tb-group" data-cap="底图与计算">
      <button id="btn-basemap" class="tb" title="导入底图：支持 JPG / PNG / WebP / PDF（第 1 页）/ DXF 线图">
        <svg class="ic" viewBox="0 0 16 16"><path d="M2 4h12v8H2zM2 10l3-3 3 3 2-2 4 4"/></svg>
        <span class="tb-label">导入底图</span>
      </button>
      <button id="btn-calibrate" class="tb" title="两点定标：在底图上点两个已知实际距离的点，输入米数后自动校准比例">
        <svg class="ic" viewBox="0 0 16 16"><path d="M2 12l10-10M4 12v2M7 9v2M10 6v2M12 4v2"/></svg>
        <span class="tb-label">两点定标</span>
      </button>
      <button id="btn-noise" class="tb strong" title="识别噪声源：按阈值找出 8 邻域严格局部极大值，标为红圈">
        <svg class="ic" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5"/><circle cx="8" cy="8" r="1.6"/></svg>
        <span class="tb-label">识别噪声源</span>
      </button>
    </div>
  </header>

  <div id="body">
    <!-- ── 左侧 ── -->
    <aside id="sidebar">
      <div class="panel-title">对象树</div>
      <div id="obj-tree" class="tree"></div>

      <div class="m-side-actions">
        <button id="m-new-project" class="primary">新建项目</button>
        <button id="m-demo">示例</button>
        <button id="m-import">导入</button>
        <button id="m-export">导出</button>
      </div>

      <div class="panel-title">项目 <span id="project-count" class="badge">0</span></div>
      <div id="project-list" class="scroll short"></div>

      <div class="spacer-v"></div>
      <div id="storage-hint" class="hint small"></div>
    </aside>

    <!-- ── 中央 ── -->
    <main id="main">
      <div id="empty-state" class="empty">
        <div class="empty-box">
          <div class="empty-title">未打开项目</div>
          <div class="empty-sub">新建一个项目开始测量，或先载入示例数据体验。</div>
          <div class="empty-actions">
            <button id="empty-new" class="primary">新建项目</button>
            <button id="empty-demo">载入示例</button>
          </div>
        </div>
      </div>

      <div id="workspace" hidden>
        <section id="tab-entry" class="tab-page">
          <div id="entry-canvas-wrap" class="canvas-wrap"></div>
        </section>

        <section id="tab-contour" class="tab-page split" hidden>
          <div class="m-action-strip">
            <button data-cmd="basemap">导入底图</button>
            <button data-cmd="calibrate">两点定标</button>
            <button data-cmd="noise">识别噪声源</button>
            <button data-cmd="zoom-fit">适应全图</button>
          </div>
          <div id="contour-canvas-wrap" class="canvas-wrap"></div>
          <aside id="right-dock">
            <div class="dock-sheet-head">
              <span>图层与设置</span>
              <button id="dock-close" type="button">关闭</button>
            </div>
            <section class="dock-sec" data-sec="layers">
              <button class="dock-head">图层显示<span class="caret2">▾</span></button>
              <div class="dock-body">
                <div class="chk-list">
                  <label><input type="checkbox" id="chk-points" checked /> 测点</label>
                  <label><input type="checkbox" id="chk-contours" checked /> 等值线</label>
                  <label><input type="checkbox" id="chk-gridlines" checked /> 参考网格</label>
                  <label><input type="checkbox" id="chk-dims" checked /> 图纸尺寸</label>
                  <label><input type="checkbox" id="chk-scalebar" checked /> 比例尺</label>
                  <label><input type="checkbox" id="chk-calib" checked /> 定标线段</label>
                </div>
              </div>
            </section>

            <section class="dock-sec" data-sec="bands">
              <button class="dock-head">色阶分级<span class="caret2">▾</span></button>
              <div class="dock-body">
                <div id="band-choices" class="band-grid"></div>
                <div class="ctl-row">
                  <span class="ctl-label">透明度</span>
                  <input type="range" id="alpha-slider" min="10" max="100" value="72" />
                  <span id="alpha-label" class="readout">72%</span>
                </div>
              </div>
            </section>

            <section class="dock-sec" data-sec="scope">
              <button class="dock-head">计算范围<span class="caret2">▾</span></button>
              <div class="dock-body">
                <div class="seg-row" id="scope-choices">
                  <button type="button" data-scope="paper" title="等压级图铺满整幅图纸（含定标后超出的底图范围）">整幅图纸</button>
                  <button type="button" data-scope="points" title="只在测点分布范围内成图，图面更集中">仅测点区域</button>
                </div>
                <div class="hint small">整幅图纸：远处按距离衰减到底噪下限；仅测点区域：彩图只覆盖普查范围。</div>
              </div>
            </section>

            <section class="dock-sec" data-sec="legend">
              <button class="dock-head">声压级标尺<span class="caret2">▾</span></button>
              <div class="dock-body">
                <div id="contour-legend"></div>
              </div>
            </section>

            <section class="dock-sec" data-sec="basemap">
              <button class="dock-head">底图对齐<span class="caret2">▾</span></button>
              <div class="dock-body">
                <div id="basemap-hint" class="hint small"></div>
                <div class="btn-grid">
                  <button data-bm="in" title="底图放大 10%（不影响声场层）">底图＋</button>
                  <button data-bm="out" title="底图缩小 10%（不影响声场层）">底图－</button>
                  <button data-bm="left" title="底图左移 2%">←</button>
                  <button data-bm="right" title="底图右移 2%">→</button>
                  <button data-bm="up" title="底图上移 2%">↑</button>
                  <button data-bm="down" title="底图下移 2%">↓</button>
                  <button data-bm="reset" class="span2" title="底图复位：缩放 1.0、偏移 0">复位底图</button>
                </div>
              </div>
            </section>

            <section class="dock-sec" data-sec="output">
              <button class="dock-head">输出<span class="caret2">▾</span></button>
              <div class="dock-body">
                <div class="btn-grid">
                  <button id="btn-export-img" class="span2" title="把当前图纸导出为 PNG 图片">导出图像 (PNG)</button>
                  <button id="btn-export-pdf" class="span2" title="把当前图纸导出为 A4 PDF">导出 PDF</button>
                  <button id="btn-copy-img" class="span2" title="复制图像到剪贴板，可直接粘贴到 Word / CAD">复制图像</button>
                </div>
              </div>
            </section>

            <section class="dock-sec" data-sec="stats">
              <button class="dock-head">统计<span class="caret2">▾</span></button>
              <div class="dock-body">
                <div id="contour-stats" class="kv"></div>
                <div id="noise-hint" class="hint small"></div>
              </div>
            </section>
          </aside>
        </section>

        <section id="tab-settings" class="tab-page" hidden>
          <form id="settings-form" class="form-grid">
            <label>项目名称 <input name="name" required /></label>
            <label>备注（厂名 / 区域） <input name="description" /></label>
            <label>图纸宽度 (m) <input name="worldW" type="number" step="0.1" min="1" required /></label>
            <label>图纸高度 (m) <input name="worldH" type="number" step="0.1" min="1" required /></label>
            <label>背景噪声 / 底噪 (dBA)
              <input name="backgroundNoiseDb" type="number" step="0.1" min="0" />
            </label>
            <div class="form-actions">
              <button class="primary" type="submit">保存设置</button>
            </div>
          </form>
        </section>

        <div id="calib-banner" class="calib-banner" hidden>
          校准模式：在底图上依次点击两个已知实际距离的点（如厂房轴线两端）。按 Esc 或再点「两点定标」退出。
        </div>
      </div>
    </main>
  </div>

  <!-- ── 移动端底部导航（仅窄屏显示）── -->
  <nav id="m-nav">
    <button data-tab="entry" class="m-tab active"><span class="m-ico">▦</span><span>录入</span></button>
    <button data-tab="contour" class="m-tab"><span class="m-ico">▩</span><span>等压级图</span></button>
    <button data-tab="settings" class="m-tab"><span class="m-ico">⚙</span><span>设置</span></button>
    <button id="m-btn-layers" class="m-tab"><span class="m-ico">◧</span><span>图层</span></button>
    <button id="m-btn-tools" class="m-tab"><span class="m-ico">✦</span><span>工具</span></button>
  </nav>

  <div class="m-sheet-mask" id="m-mask" hidden></div>

  <!-- 移动端工具抽屉 -->
  <div id="m-sheet-tools" class="m-sheet">
    <div class="m-sheet-head"><span>工具</span><button class="m-sheet-close">关闭</button></div>
    <div class="m-sheet-body">
      <button class="m-big" data-cmd="basemap"><span class="m-big-ico">▤</span>导入底图</button>
      <button class="m-big" data-cmd="calibrate"><span class="m-big-ico">⟷</span>两点定标</button>
      <button class="m-big" data-cmd="import-points"><span class="m-big-ico">▦</span>导入测点表</button>
      <button class="m-big" data-cmd="zoom-fit"><span class="m-big-ico">⤢</span>适应全图</button>
      <button class="m-big" data-cmd="noise"><span class="m-big-ico">◎</span>识别噪声源</button>
      <button class="m-big" data-cmd="export-img"><span class="m-big-ico">▧</span>导出图像</button>
      <button class="m-big" data-cmd="export-pdf"><span class="m-big-ico">▨</span>导出 PDF</button>
      <button class="m-big" data-cmd="copy-img"><span class="m-big-ico">⧉</span>复制图像</button>
      <button class="m-big" data-cmd="about"><span class="m-big-ico">ⓘ</span>关于</button>
    </div>
  </div>

  <!-- ── 状态栏 ── -->
  <footer id="statusbar">
    <span id="st-coords">X — m　Y — m</span>
    <span class="sb-sep"></span>
    <span id="st-zoom">缩放 1.0×</span>
    <span class="sb-sep"></span>
    <span id="st-progress">已测 0 / 0</span>
    <span class="sb-sep"></span>
    <span id="st-grid">网格 —</span>
    <span class="spacer"></span>
    <span id="st-hint">滚轮缩放 · 拖动空白处平移 · 单击空白处加点 · 拖动测点改位置</span>
  </footer>
</div>

<dialog id="form-dialog">
  <form method="dialog">
    <h3 id="fd-title"></h3>
    <div id="fd-body" class="fd-body"></div>
    <menu>
      <button value="cancel">取消</button>
      <button id="fd-submit" value="ok" class="primary">确定</button>
    </menu>
  </form>
</dialog>

<dialog id="point-dialog">
  <form method="dialog">
    <h3 id="pd-title">测点</h3>
    <label>声压级 (dB，声级计实测值)
      <input id="pd-spl" type="number" step="0.1" />
    </label>
    <label>测点编号（图上显示在数值下方）
      <input id="pd-label" placeholder="如 1 / A3" />
    </label>
    <label>备注（设备 / 工况）
      <input id="pd-note" />
    </label>
    <menu>
      <button value="cancel">取消</button>
      <button id="pd-clear" type="button" class="danger">清除该点</button>
      <button id="pd-save" value="save" class="primary">保存</button>
    </menu>
  </form>
</dialog>

<input type="file" id="import-file" accept=".json" hidden />
<input type="file" id="points-file" accept=".json,.csv,.txt,text/csv,text/plain" hidden />
<input type="file" id="basemap-file" accept=".jpg,.jpeg,.png,.webp,.bmp,.gif,.pdf,.dxf" hidden />
<script type="module" src="/src/main.ts"></script>
</body>
</html>
